# Push a tag like v0.2.0 (after bumping lib/special_builder/version.rb) and this publishes a GitHub
# release, which CMS installs offer as an update in Settings > Plugins.
name: Release
on:
  push:
    tags: [ "v*" ]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the version matches the tag
        run: |
          version=$(ruby -e 'load "lib/special_builder/version.rb"; puts SpecialBuilder::VERSION')
          test "v$version" = "$GITHUB_REF_NAME" || { echo "version.rb says $version, the tag is $GITHUB_REF_NAME"; exit 1; }
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
